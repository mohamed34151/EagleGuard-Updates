name: Train ML model

on:
  workflow_dispatch:
  push:
    paths: ["trainer/**", ".github/workflows/train-model.yml"]

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy lightgbm scikit-learn
      - name: Train on EMBER 2018 (features only, no malware files)
        run: python trainer/train_ember.py "${{ runner.temp }}/ember" model
      - name: Save the model in the repository (included in the next signed package)
        run: |
          git config user.name "eagleguard-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model
          git commit -m "ML model $(date -u +%Y-%m-%d)" || echo "no change"
          git push
