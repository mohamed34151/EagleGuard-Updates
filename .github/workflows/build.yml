name: Build signature package

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-package
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install cryptography
      - name: Build and sign
        env:
          ABUSE_CH_AUTH_KEY: ${{ secrets.ABUSE_CH_AUTH_KEY }}
          EAGLEGUARD_SIGNING_KEY: ${{ secrets.EAGLEGUARD_SIGNING_KEY }}
        run: python builder/build_pack.py dist work
      - name: Publish to the dist branch (only the newest package is kept)
        run: |
          cd dist
          git init -q -b dist
          git config user.name "eagleguard-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Signature package $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
